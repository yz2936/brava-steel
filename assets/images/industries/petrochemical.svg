<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="pc-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14213d"/>
      <stop offset="1" stop-color="#1c3055"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" fill="url(#pc-bg)"/>
  <!-- Smoke/steam -->
  <g fill="rgba(241,243,246,0.07)">
    <ellipse cx="280" cy="40" rx="80" ry="22"/>
    <ellipse cx="350" cy="60" rx="100" ry="26"/>
    <ellipse cx="900" cy="50" rx="90" ry="20"/>
  </g>

  <!-- Refinery towers -->
  <g stroke="#f1f3f6" stroke-width="3" fill="none" stroke-linejoin="miter">
    <!-- Distillation tower 1 (tall) -->
    <rect x="220" y="120" width="60" height="220"/>
    <!-- Cap -->
    <ellipse cx="250" cy="120" rx="30" ry="10"/>
    <!-- Trays -->
    <line x1="220" y1="160" x2="280" y2="160" opacity="0.5"/>
    <line x1="220" y1="190" x2="280" y2="190" opacity="0.5"/>
    <line x1="220" y1="220" x2="280" y2="220" opacity="0.5"/>
    <line x1="220" y1="250" x2="280" y2="250" opacity="0.5"/>
    <line x1="220" y1="280" x2="280" y2="280" opacity="0.5"/>
    <line x1="220" y1="310" x2="280" y2="310" opacity="0.5"/>
    <!-- Side ladders -->
    <line x1="285" y1="135" x2="285" y2="335"/>
    <!-- Stack with red flame -->
    <line x1="250" y1="120" x2="250" y2="80"/>
    <rect x="245" y="60" width="10" height="20"/>

    <!-- Tower 2 -->
    <rect x="380" y="160" width="50" height="180"/>
    <ellipse cx="405" cy="160" rx="25" ry="8"/>
    <line x1="380" y1="200" x2="430" y2="200" opacity="0.5"/>
    <line x1="380" y1="240" x2="430" y2="240" opacity="0.5"/>
    <line x1="380" y1="280" x2="430" y2="280" opacity="0.5"/>

    <!-- Tower 3 (with red top flare) -->
    <rect x="500" y="100" width="55" height="240"/>
    <ellipse cx="527" cy="100" rx="28" ry="9"/>
    <line x1="527" y1="100" x2="527" y2="50"/>
    <line x1="500" y1="140" x2="555" y2="140" opacity="0.5"/>
    <line x1="500" y1="180" x2="555" y2="180" opacity="0.5"/>
    <line x1="500" y1="220" x2="555" y2="220" opacity="0.5"/>
    <line x1="500" y1="260" x2="555" y2="260" opacity="0.5"/>
    <line x1="500" y1="300" x2="555" y2="300" opacity="0.5"/>

    <!-- Cracker furnace -->
    <rect x="620" y="200" width="120" height="140"/>
    <line x1="640" y1="200" x2="640" y2="170"/>
    <line x1="680" y1="200" x2="680" y2="170"/>
    <line x1="720" y1="200" x2="720" y2="170"/>
    <!-- Coil pattern inside -->
    <g stroke-width="1.8" opacity="0.7">
      <path d="M635 220 L725 220 M635 240 L725 240 M635 260 L725 260 M635 280 L725 280 M635 300 L725 300 M635 320 L725 320"/>
    </g>
    <!-- Stack -->
    <rect x="660" y="170" width="40" height="20"/>

    <!-- Storage spheres -->
    <circle cx="820" cy="290" r="38"/>
    <line x1="820" y1="290" x2="820" y2="328"/>
    <line x1="800" y1="328" x2="840" y2="328"/>
    <line x1="794" y1="290" x2="846" y2="290" opacity="0.4"/>
    <circle cx="900" cy="295" r="32"/>
    <line x1="900" y1="295" x2="900" y2="327"/>

    <!-- Far horizontal pipework -->
    <line x1="180" y1="345" x2="1020" y2="345" stroke-width="2.5"/>
    <line x1="180" y1="335" x2="1020" y2="335" stroke-width="2.5" opacity="0.5"/>
  </g>

  <!-- Flame on tower 3 -->
  <path d="M520 50 Q527 30 527 20 Q527 35 535 50 Z" fill="#c43850" opacity="0.85"/>

  <!-- Highlighted process pipe (red) -->
  <g stroke="#c43850" stroke-width="3" fill="none">
    <path d="M250 340 Q300 360 405 340"/>
    <path d="M527 340 Q570 360 680 340"/>
  </g>

  <!-- Ground -->
  <line x1="0" y1="345" x2="1200" y2="345" stroke="#f1f3f6" stroke-width="1" opacity="0.2"/>

  <!-- Label -->
  <text x="600" y="395" text-anchor="middle" fill="#c43850" font-family="Oswald, Arial, sans-serif" font-size="11" letter-spacing="2">CRACKER &amp; REFORMER · 321H · 347H · 310H · T22</text>
</svg>
