<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="vi-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14213d"/>
      <stop offset="1" stop-color="#2a4173"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" fill="url(#vi-bg)"/>

  <!-- Background grid -->
  <g stroke="rgba(241,243,246,0.05)" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="420"/>
    <line x1="400" y1="0" x2="400" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="800" y1="0" x2="800" y2="420"/>
    <line x1="1000" y1="0" x2="1000" y2="420"/>
  </g>

  <!-- Pressure gauge (large, central) -->
  <g stroke="#f1f3f6" stroke-width="3" fill="none">
    <circle cx="350" cy="210" r="120"/>
    <circle cx="350" cy="210" r="105" stroke-width="1.5" opacity="0.5"/>
    <!-- Tick marks -->
    <g stroke-width="2">
      <line x1="350" y1="105" x2="350" y2="120"/>
      <line x1="455" y1="210" x2="440" y2="210"/>
      <line x1="350" y1="315" x2="350" y2="300"/>
      <line x1="245" y1="210" x2="260" y2="210"/>
    </g>
    <g stroke-width="1" opacity="0.6">
      <line x1="408" y1="120" x2="402" y2="130"/>
      <line x1="445" y1="160" x2="436" y2="166"/>
      <line x1="445" y1="260" x2="436" y2="254"/>
      <line x1="408" y1="300" x2="402" y2="290"/>
      <line x1="293" y1="120" x2="299" y2="130"/>
      <line x1="256" y1="160" x2="265" y2="166"/>
      <line x1="256" y1="260" x2="265" y2="254"/>
      <line x1="293" y1="300" x2="299" y2="290"/>
    </g>
    <!-- Gauge needle (red) -->
  </g>
  <line x1="350" y1="210" x2="420" y2="160" stroke="#c43850" stroke-width="4" stroke-linecap="round"/>
  <circle cx="350" cy="210" r="10" fill="#c43850"/>
  <text x="350" y="245" text-anchor="middle" fill="#f1f3f6" font-family="Oswald, Arial, sans-serif" font-size="14" letter-spacing="2">PSI</text>

  <!-- Process inlet pipe -->
  <g stroke="#f1f3f6" stroke-width="3" fill="none">
    <line x1="290" y1="350" x2="350" y2="350"/>
    <line x1="350" y1="350" x2="350" y2="330"/>
  </g>

  <!-- Right side: control valve -->
  <g stroke="#f1f3f6" stroke-width="3" fill="none" stroke-linejoin="miter">
    <!-- Pipe -->
    <line x1="600" y1="230" x2="900" y2="230"/>
    <line x1="600" y1="260" x2="900" y2="260"/>
    <!-- Valve body -->
    <path d="M720 230 L720 200 L780 200 L780 230 Z"/>
    <path d="M720 260 L720 290 L780 290 L780 260 Z"/>
    <!-- Stem -->
    <line x1="750" y1="200" x2="750" y2="120"/>
    <!-- Actuator (top) -->
    <ellipse cx="750" cy="115" rx="40" ry="22"/>
    <line x1="710" y1="115" x2="790" y2="115"/>
    <!-- Bonnet -->
    <rect x="740" y="135" width="20" height="65"/>
    <!-- Flanges -->
    <line x1="640" y1="220" x2="640" y2="270"/>
    <line x1="660" y1="220" x2="660" y2="270"/>
    <line x1="840" y1="220" x2="840" y2="270"/>
    <line x1="860" y1="220" x2="860" y2="270"/>
    <!-- Bolt circles -->
    <g fill="#f1f3f6">
      <circle cx="640" cy="225" r="2"/>
      <circle cx="640" cy="265" r="2"/>
      <circle cx="660" cy="225" r="2"/>
      <circle cx="660" cy="265" r="2"/>
    </g>
  </g>

  <!-- Impulse / sample tube highlighted in red -->
  <g stroke="#c43850" stroke-width="2.5" fill="none">
    <path d="M750 230 L750 350 L580 350 L580 380"/>
  </g>
  <text x="660" y="372" text-anchor="middle" fill="#c43850" font-family="Oswald, Arial, sans-serif" font-size="10" letter-spacing="2">IMPULSE LINE · TP316/L · A269</text>

  <!-- Tubing fitting / compression detail (small) -->
  <g stroke="#f1f3f6" stroke-width="2" fill="none">
    <rect x="990" y="180" width="80" height="40"/>
    <rect x="970" y="190" width="20" height="20"/>
    <rect x="1070" y="190" width="20" height="20"/>
    <line x1="990" y1="195" x2="1070" y2="195"/>
    <line x1="990" y1="205" x2="1070" y2="205"/>
  </g>
  <text x="1030" y="245" text-anchor="middle" fill="#f1f3f6" font-family="Oswald, Arial, sans-serif" font-size="10" letter-spacing="2">FITTING</text>

  <!-- Bottom label -->
  <text x="600" y="408" text-anchor="middle" fill="#c43850" font-family="Oswald, Arial, sans-serif" font-size="11" letter-spacing="2">PRECISION INSTRUMENT TUBING · ASTM A269</text>
</svg>
