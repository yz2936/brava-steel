<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="auto-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c3055"/>
      <stop offset="1" stop-color="#14213d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" fill="url(#auto-bg)"/>
  <!-- Speed lines -->
  <g stroke="rgba(241,243,246,0.06)" stroke-width="2">
    <line x1="0" y1="80" x2="1200" y2="100"/>
    <line x1="0" y1="120" x2="1200" y2="135"/>
    <line x1="0" y1="320" x2="1200" y2="335"/>
    <line x1="0" y1="350" x2="1200" y2="360"/>
  </g>

  <!-- Car silhouette in profile -->
  <g stroke="#f1f3f6" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- Car body -->
    <path d="M250 270
             Q280 220 350 210
             L450 200 Q520 195 590 200
             L700 215 Q740 220 780 235
             L860 270 Q900 275 920 285
             L920 305
             L890 305"/>
    <!-- Bottom -->
    <path d="M280 305 L380 305 M450 305 L760 305 M820 305 L890 305"/>
    <!-- Roof / cabin -->
    <path d="M380 220 L420 175 L640 170 L700 215"/>
    <!-- Windows -->
    <line x1="425" y1="180" x2="640" y2="178"/>
    <line x1="510" y1="178" x2="510" y2="215"/>
    <!-- Wheels -->
    <circle cx="415" cy="305" r="35"/>
    <circle cx="415" cy="305" r="14"/>
    <circle cx="790" cy="305" r="35"/>
    <circle cx="790" cy="305" r="14"/>
    <!-- Door line -->
    <line x1="510" y1="220" x2="510" y2="290"/>
    <!-- Headlight -->
    <circle cx="285" cy="265" r="6" fill="#f1f3f6"/>
  </g>

  <!-- Exhaust pipe (highlighted in red) -->
  <g stroke="#c43850" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M880 295 L990 295 L1010 290 L1040 290"/>
  </g>
  <!-- Exhaust outlet -->
  <ellipse cx="1042" cy="290" rx="10" ry="6" fill="#c43850" opacity="0.8"/>
  <!-- Exhaust fumes -->
  <g fill="rgba(241,243,246,0.18)">
    <ellipse cx="1075" cy="290" rx="14" ry="8"/>
    <ellipse cx="1100" cy="285" rx="18" ry="10"/>
    <ellipse cx="1130" cy="282" rx="22" ry="12"/>
  </g>

  <!-- Highlighted catalytic-converter / muffler box -->
  <g stroke="#c43850" stroke-width="2" fill="rgba(196,56,80,0.15)">
    <rect x="930" y="280" width="50" height="22" rx="3"/>
  </g>

  <!-- Road -->
  <line x1="0" y1="345" x2="1200" y2="345" stroke="#f1f3f6" stroke-width="1" opacity="0.3"/>
  <g stroke="#c43850" stroke-width="3" stroke-dasharray="20 12" opacity="0.7">
    <line x1="0" y1="375" x2="1200" y2="375"/>
  </g>

  <!-- Label -->
  <text x="600" y="408" text-anchor="middle" fill="#c43850" font-family="Oswald, Arial, sans-serif" font-size="11" letter-spacing="2">EXHAUST &amp; FUEL · FERRITIC 430Ti / 439 / 444</text>
</svg>
